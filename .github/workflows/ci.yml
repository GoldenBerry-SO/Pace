name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build skills
        run: bun run build:skills

      - name: Build site
        run: bun run build:site

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pace-build
          path: build/
          retention-days: 7
